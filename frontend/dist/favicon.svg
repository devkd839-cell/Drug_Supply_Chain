<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#0f172a"/>

  <!-- Pill body (capsule) rotated 45 degrees -->
  <!-- Left half (blue) -->
  <path d="M8.5 19.5 L12.5 8.5 A5 5 0 0 1 17.5 8.5 L13.5 19.5 Z"
        fill="url(#blueGrad)" opacity="0.95"/>
  <!-- Right half (cyan) -->
  <path d="M13.5 19.5 L17.5 8.5 A5 5 0 0 1 22.5 13.5 L18.5 24.5 A5 5 0 0 1 13.5 19.5 Z"
        fill="url(#cyanGrad)" opacity="0.95"/>

  <!-- Blockchain node dots -->
  <circle cx="9"  cy="14" r="1.5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="16" cy="9"  r="1.5" fill="#22d3ee" opacity="0.8"/>
  <circle cx="23" cy="14" r="1.5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="16" cy="24" r="1.5" fill="#22d3ee" opacity="0.8"/>

  <!-- Connecting lines (blockchain links) -->
  <line x1="9"  y1="14" x2="16" y2="9"  stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="9"  x2="23" y2="14" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
  <line x1="23" y1="14" x2="16" y2="24" stroke="#06b6d4" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="24" x2="9"  y2="14" stroke="#06b6d4" stroke-width="0.8" opacity="0.5"/>
  <line x1="9"  y1="14" x2="23" y2="14" stroke="#3b82f6" stroke-width="0.6" opacity="0.3"/>
  <line x1="16" y1="9"  x2="16" y2="24" stroke="#06b6d4" stroke-width="0.6" opacity="0.3"/>

  <defs>
    <linearGradient id="blueGrad" x1="8.5" y1="8.5" x2="17.5" y2="19.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="13.5" y1="8.5" x2="22.5" y2="24.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
</svg>
